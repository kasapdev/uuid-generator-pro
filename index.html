<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="Generate UUID v4 and ULID identifiers in bulk, with format toggles, copy and download — fast, private, offline.">
  <title>UUID / ULID Generator — Web Utility Suite</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar container">
    <a class="brand" href="https://github.com/kasapdev/web-utility-suite" aria-label="Back to Web Utility Suite">
      <span class="logo" aria-hidden="true">
        <!-- fingerprint / identity icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 11c0 3-1 6-3 8"/>
          <path d="M8.5 5.5C10 4.5 11 4 12 4a6 6 0 0 1 6 6c0 1.5-.2 3-.6 4.4"/>
          <path d="M5.5 8.5C5.2 9.6 5 10.8 5 12c0 1.5-.3 3-1 4"/>
          <path d="M12 11a2 2 0 0 1 4 0c0 4-1.5 7-3 9"/>
          <path d="M9 11a3 3 0 0 1 6 0"/>
          <path d="M2 12a10 10 0 0 1 3.5-7.6"/>
        </svg>
      </span>
      <span class="col" style="gap:0">
        <span>UUID / ULID Generator</span>
        <span class="sub">Web Utility Suite</span>
      </span>
    </a>
    <span class="spacer"></span>

    <span id="statusBadge" class="badge" role="status" aria-live="polite" title="Last batch">
      <span class="status-dot" aria-hidden="true"></span><span id="statusText">Ready</span>
    </span>

    <button class="btn btn--icon" data-shortcut-help title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"/>
      </svg>
    </button>
    <button class="btn btn--icon" data-theme-toggle title="Toggle theme" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <main class="container">
    <!-- Controls -->
    <section class="panel controls-panel fade-in" aria-label="Generator controls">
      <div class="controls-row">
        <div class="segmented" role="tablist" aria-label="ID type">
          <button id="mode-uuid" role="tab" aria-selected="true" class="is-active" data-mode="uuid">UUID v4</button>
          <button id="mode-ulid" role="tab" aria-selected="false" data-mode="ulid">ULID</button>
        </div>

        <div class="field-inline">
          <label for="countInput">Count</label>
          <input type="number" id="countInput" min="1" max="1000" step="1" value="1" inputmode="numeric" aria-label="Number of IDs to generate">
        </div>

        <button id="btnGenerate" class="btn btn--primary" title="Generate (Ctrl/Cmd+Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          Generate
        </button>
      </div>

      <div class="controls-row" id="uuidOptionsRow">
        <label class="check" title="Use the manual RFC4122 v4 implementation instead of crypto.randomUUID()">
          <span class="switch">
            <input type="checkbox" id="manualUuid" aria-label="Use manual RFC4122 v4 implementation">
            <span class="track"></span><span class="thumb"></span>
          </span>
          <span class="secondary">Manual RFC4122 v4 (educational)</span>
        </label>

        <label class="check">
          <span class="switch">
            <input type="checkbox" id="optHyphens" checked aria-label="Include hyphens">
            <span class="track"></span><span class="thumb"></span>
          </span>
          <span class="secondary">Hyphens</span>
        </label>

        <label class="check">
          <span class="switch">
            <input type="checkbox" id="optUppercase" aria-label="Uppercase">
            <span class="track"></span><span class="thumb"></span>
          </span>
          <span class="secondary">Uppercase</span>
        </label>

        <label class="check">
          <span class="switch">
            <input type="checkbox" id="optBraces" aria-label="Wrap in braces">
            <span class="track"></span><span class="thumb"></span>
          </span>
          <span class="secondary">Braces {}</span>
        </label>
      </div>

      <p id="modeHint" class="muted" style="margin:var(--space-2) 0 0;font-size:12.5px"></p>
    </section>

    <!-- Output -->
    <section class="panel output-panel rise" aria-label="Generated IDs">
      <div class="pane-head">
        <h2 class="pane-title">Output</h2>
        <span id="outputStats" class="muted pane-meta mono"></span>
      </div>

      <div class="output-scroll">
        <textarea id="output" class="mono" readonly spellcheck="false" aria-label="Generated identifiers" placeholder="Click Generate to create IDs…"></textarea>

        <div id="emptyState" class="empty output-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 11c0 3-1 6-3 8"/>
            <path d="M8.5 5.5C10 4.5 11 4 12 4a6 6 0 0 1 6 6c0 1.5-.2 3-.6 4.4"/>
            <path d="M9 11a3 3 0 0 1 6 0"/>
          </svg>
          <p>Your generated IDs will appear here.</p>
          <button id="btnGenerateEmpty" class="btn btn--sm">Generate one now</button>
        </div>
      </div>

      <div class="toolbar-group" style="margin-top:var(--space-4)">
        <button id="btnCopyAll" class="btn btn--sm" title="Copy all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy all
        </button>
        <button id="btnDownload" class="btn btn--sm" title="Download .txt">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Download .txt
        </button>
        <button id="btnClear" class="btn btn--sm btn--ghost" title="Clear output">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          Clear
        </button>
      </div>
    </section>

    <!-- Per-item list -->
    <section id="listPanel" class="panel list-panel fade-in" aria-label="Individual IDs" hidden>
      <div class="pane-head">
        <h2 class="pane-title">Individual IDs</h2>
        <span id="listCount" class="muted pane-meta mono"></span>
      </div>
      <ul id="idList" class="id-list"></ul>
    </section>
  </main>

  <footer class="app-footer container">
    Part of the <a href="https://github.com/kasapdev/web-utility-suite">Web Utility Suite</a> · MIT Licensed
  </footer>

  <!-- Shortcuts help modal -->
  <div id="helpBackdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <div class="row between center" style="margin-bottom:var(--space-4)">
        <h3 id="helpTitle" style="margin:0">Keyboard shortcuts</h3>
        <button id="helpClose" class="btn btn--icon btn--ghost" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <table class="shortcut-table">
        <tbody id="shortcutRows"></tbody>
      </table>
      <p class="muted" style="margin:var(--space-4) 0 0;font-size:13px">Tip: <kbd>mod</kbd> means <kbd>Ctrl</kbd> on Windows/Linux and <kbd>⌘</kbd> on macOS.</p>
    </div>
  </div>

  <script src="assets/js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
